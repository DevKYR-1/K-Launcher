name: KP play test (emulator)

# Installs the latest pre-release APK in an Android emulator, creates a Local account, selects a Minecraft
# version (Java 8 / 17 / 21) that is not installed and presses PLAY. A Local account must not download game
# files, so the expected outcome is the "Microsoft account required" dialog: no crash, no raw stack trace,
# the technical details in launcher-log.txt, and a working "Microsoft login" button. The job fails when the
# outcome is anything else. It does not change the app.
# Output (screenshots, UI dumps, logs) is pushed to the "ci-play-<version>" branches.
#
# When the commit that triggered this run also changed the app, the Android CI builds it and publishes the APK.
# This job waits for the running build first, so it tests the new APK and not the one of an older build.

on:
  workflow_dispatch:
  push:
    branches: [ k-projects-ui ]
    paths:
      - '.github/workflows/kp-play.yml'
      - '.github/kp/play.sh'
      - '.github/kp/lib.sh'
      - '.github/kp/fetch-apk.sh'

jobs:
  play:
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        version: [ "1.7.10", "1.18.2", "1.21.1" ]
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the running build, then download the APK
        env:
          GH_TOKEN: ${{ github.token }}
          KP_FIRST_WAIT: ${{ github.event_name == 'push' && '45' || '0' }}
        run: bash .github/kp/fetch-apk.sh "${{ github.repository }}" app.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Press PLAY with ${{ matrix.version }} in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          cores: 4
          ram-size: 6144M
          disk-size: 8192M
          emulator-boot-timeout: 900
          script: bash .github/kp/play.sh app.apk play-out ${{ matrix.version }}

      - name: Publish output to a ci-play branch
        if: always()
        run: |
          set -e
          test -d play-out || { echo "no play-out folder"; exit 0; }
          branch="ci-play-$(echo '${{ matrix.version }}' | tr . -)"
          mkdir -p "$RUNNER_TEMP/out"
          cp play-out/* "$RUNNER_TEMP/out/" 2>/dev/null || true
          cd "$RUNNER_TEMP/out"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$branch"
          git add -A
          git commit -q -m "Emulator play test output (${{ matrix.version }}) for ${GITHUB_SHA}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$branch"

      - name: Check the result
        if: always()
        run: |
          cat play-out/summary.txt
          grep -q ' result=ok ' play-out/summary.txt
