name: KP inspect (temporary)

# Temporary helper: prints which Java runtime builds / release files are still downloadable.
# It only reads public information and is removed again once the build works.

on:
  push:
    branches: [ k-projects-ui ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: List JRE artifacts and releases
        run: |
          set +e
          for repo in AngelAuraMC/angelauramc-openjdk-build PojavLauncherTeam/android-openjdk-build-multiarch; do
            echo "=== ARTIFACTS $repo"
            gh api "repos/$repo/actions/artifacts?per_page=100" --jq '.artifacts[] | "\(.name)\texpired=\(.expired)\tcreated=\(.created_at)\texpires=\(.expires_at)\tbranch=\(.workflow_run.head_branch)\tsize=\(.size_in_bytes)"' 2>&1 | head -60
            echo "=== RELEASES $repo"
            gh api "repos/$repo/releases?per_page=30" --jq '.[] | "\(.tag_name)\t\(.published_at)\t" + ([.assets[] | "\(.name)(\(.size))"] | join(", "))' 2>&1 | head -40
          done
          for repo in PojavLauncherTeam/PojavLauncher AngelAuraMC/Amethyst-Android; do
            echo "=== RELEASES $repo"
            gh api "repos/$repo/releases?per_page=8" --jq '.[] | "\(.tag_name)\t\(.published_at)\t" + ([.assets[] | "\(.name)(\(.size))"] | join(", "))' 2>&1 | head -30
          done
