name: Android CI

# K-Projects note: this is the upstream PojavLauncher workflow with these changes only:
#  - the Java 8 / 17 / 21 runtimes are taken from the last official PojavLauncher release APK
#    ("gladiolus"), because the artifacts of the PojavLauncherTeam JRE builds have expired and can
#    no longer be downloaded;
#  - the Google Play / "no runtime" steps were removed (they only run for the upstream organisation);
#  - the debug APK is uploaded right after it is built and also attached to a pre-release.

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk2'
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk2'
    paths-ignore:
      - '.github/kp/**'
      - '.github/workflows/kp-*.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        run: |
          apt update && apt install wget
          cd app_pojavlauncher/libs
          wget https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      - name: Get Java 8 / 17 / 21 runtimes (official PojavLauncher release)
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/pojav-release"
          assets=app_pojavlauncher/src/main/assets/components
          mkdir -p "$tmp"
          curl -fL --retry 3 --retry-delay 5 -o "$tmp/PojavLauncher.apk" \
            "https://github.com/PojavLauncherTeam/PojavLauncher/releases/download/gladiolus/PojavLauncher.apk"
          ls -lh "$tmp/PojavLauncher.apk"
          echo "--- runtime files inside the official APK:"
          unzip -l "$tmp/PojavLauncher.apk" | grep -E 'assets/components/(jre|jre-new|jre-21)/' || true
          unzip -q -o "$tmp/PojavLauncher.apk" \
            'assets/components/jre/*' 'assets/components/jre-new/*' 'assets/components/jre-21/*' \
            -d "$tmp/x"
          for d in jre jre-new jre-21; do
            mkdir -p "$assets/$d"
            cp -r "$tmp/x/assets/components/$d/." "$assets/$d/"
            for f in universal.tar.xz version bin-arm64.tar.xz; do
              test -s "$assets/$d/$f" || { echo "::error::missing $d/$f"; exit 1; }
            done
          done
          rm -rf "$tmp"
          ls -lh "$assets"/jre "$assets"/jre-new "$assets"/jre-21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh

          mkdir out
          # Build JRE JAR files (security manager, etc...)
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # K-Projects: tests of the download engine (HTTP statuses, retries, SHA-1, half downloaded files),
      # the account/session rules and the error messages. They run against a local HTTP server, no internet needed.
      - name: Unit tests
        run: gradle :app_pojavlauncher:testDebugUnitTest

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app_pojavlauncher/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Build Debug .apk
        run: |
          # Build the launcher
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Gen md5sums
        run: |
          md5sum out/app-debug.apk > out/app-debug.md5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug.*

      - name: Publish pre-release with the APK
        if: github.ref == 'refs/heads/k-projects-ui'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          tag=k-projects-latest
          cp out/app-debug.apk out/K-Projects-debug.apk
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          **K-Projects** - debug build of a re-skinned [PojavLauncher](https://github.com/PojavLauncherTeam/PojavLauncher) (LGPLv3).
          The interface is new. The game download and the account/login code were also repaired: clear messages instead of stack traces,
          retries, SHA-1 checks, a log file (`launcher-log.txt`) and Microsoft session handling. Source code: this repository, branch `k-projects-ui`.
          See `NOTICE-K-Projects.md` for the list of changes and the credits.

          - Installs next to the original PojavLauncher (package `net.kdt.pojavlaunch.debug`).
          - A Local account cannot download game files (rule of the launcher): sign in once with a Microsoft account that owns Minecraft: Java Edition and press Play to download a version.
          - Upstream PojavLauncher is discontinued, so very new Minecraft versions may not run.
          - Not affiliated with Mojang, Microsoft or the PojavLauncher team.

          Turkce: `K-Projects-debug.apk` dosyasini indirip kur (telefon "bilinmeyen kaynaklardan yukleme" izni isteyebilir).
          EOF
          printf '\nBuilt from commit %s (%s UTC).\n' "${GITHUB_SHA:0:7}" "$(date -u '+%Y-%m-%d %H:%M')" >> "$RUNNER_TEMP/notes.md"

          # The old release is never deleted before the new APK is in place. An earlier version of this step deleted
          # the release first, and when GitHub then refused to create the new one (HTTP 403) the download page was empty.
          publish() {
            if gh release view "$tag" -R "$REPO" > /dev/null 2>&1; then
              echo "release $tag exists: replacing the APK"
              gh release upload "$tag" out/K-Projects-debug.apk -R "$REPO" --clobber || return 1
              gh release edit "$tag" -R "$REPO" --prerelease \
                --title "K-Projects debug build (latest)" \
                --notes-file "$RUNNER_TEMP/notes.md" || return 1
              # Bring the tag to the built commit. The APK is already replaced, so this part may fail without a failed build.
              gh api -X PATCH "repos/$REPO/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true > /dev/null \
                || echo "::warning::the APK was replaced, but the tag $tag could not be moved to $GITHUB_SHA"
            else
              echo "no release $tag yet: creating it"
              gh release create "$tag" out/K-Projects-debug.apk -R "$REPO" \
                --target "$GITHUB_SHA" \
                --prerelease \
                --title "K-Projects debug build (latest)" \
                --notes-file "$RUNNER_TEMP/notes.md" || return 1
            fi
          }
          for attempt in 1 2 3; do
            if publish; then exit 0; fi
            echo "publishing failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
          echo "::error::The release could not be published. The built APK is still in the 'app-debug' artifact of this run."
          exit 1
